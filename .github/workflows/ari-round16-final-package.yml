name: ARI Round16 Final Package

on:
  push:
    branches:
      - ari-round16-release
  workflow_dispatch:

jobs:
  final-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Reconstruct and validate Round 15 baseline
        shell: pwsh
        run: .\.github\scripts\build-ari-round15.ps1

      - name: Apply Round 16 UI and window fixes
        shell: pwsh
        run: .\.github\scripts\apply-ari-round16.ps1

      - name: Apply and verify sidebar contrast hotfix
        shell: pwsh
        run: .\.github\scripts\apply-ari-sidebar-contrast-hotfix.ps1

      - name: Build, verify and package final portable release
        shell: pwsh
        run: .\.github\scripts\package-ari-round16-final.ps1

      - name: Upload final clean portable package
        uses: actions/upload-artifact@v4
        with:
          name: ARI-Round16-FINAL-Portable-win-x64
          path: ARI-Round16-FINAL-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
