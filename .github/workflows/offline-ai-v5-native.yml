name: Offline AI native engines
on:
  push:
    branches: [build/offline-android-verification-20260911]
    paths: ['.github/workflows/offline-ai-v5-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare sources and toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work export/native export/source export/licenses
          git clone --depth 1 --branch v0.4.0 https://github.com/ggml-org/llama.cpp work/llama
          git clone --depth 1 --branch v0.2.0 https://github.com/google/sentencepiece work/sentencepiece
          cp .offline-ai-v5/native.cpp work/native.cpp
          python - <<'PY'
          from pathlib import Path
          p=Path('work/native.cpp');s=p.read_text()
          s=s.replace('mp.use_mmap=true;mp.use_mlock=false;', 'mp.progress_callback=[](float,void*){return !cancelled.load();};')
          s=s.replace('llama_sampler_init_penalties(96,', 'llama_sampler_init_penalties(llama_vocab_n_tokens(vocab),96,')
          p.write_text(s)
          PY
          cp work/native.cpp export/source/
          cp work/llama/LICENSE export/licenses/llama-MIT.txt
          cp work/sentencepiece/LICENSE export/licenses/sentencepiece-Apache2.txt
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip
          cat > work/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(offlineai LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_OPENMP OFF CACHE BOOL "" FORCE)
          set(GGML_AVX OFF CACHE BOOL "" FORCE)
          set(GGML_AVX2 OFF CACHE BOOL "" FORCE)
          set(GGML_FMA OFF CACHE BOOL "" FORCE)
          set(GGML_F16C OFF CACHE BOOL "" FORCE)
          set(GGML_BMI2 OFF CACHE BOOL "" FORCE)
          set(SPM_ENABLE_SHARED OFF CACHE BOOL "" FORCE)
          set(SPM_BUILD_TEST OFF CACHE BOOL "" FORCE)
          set(SPM_ENABLE_TCMALLOC OFF CACHE BOOL "" FORCE)
          add_subdirectory(llama)
          add_subdirectory(sentencepiece)
          add_library(offlineai SHARED native.cpp)
          target_include_directories(offlineai PRIVATE sentencepiece/src)
          target_link_libraries(offlineai PRIVATE llama sentencepiece-static)
          if(NOT ANDROID)
            find_package(JNI REQUIRED)
            target_include_directories(offlineai PRIVATE ${JNI_INCLUDE_DIRS})
          endif()
          target_link_options(offlineai PRIVATE -Wl,-z,max-page-size=16384)
          CMAKE
          cp work/CMakeLists.txt export/source/
          git -C work/llama rev-parse HEAD > export/source/llama-commit.txt
          git -C work/sentencepiece rev-parse HEAD > export/source/sentencepiece-commit.txt
      - name: Build Linux and Android JNI
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S work -B work/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build work/build-linux --target offlineai -j 4
          mkdir -p export/native/linux-x86_64
          cp work/build-linux/libofflineai.so export/native/linux-x86_64/
          for abi in arm64-v8a x86_64; do
            cmake -S work -B work/build-$abi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$PWD/android-ndk-r27d/build/cmake/android.toolchain.cmake" -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
            cmake --build work/build-$abi --target offlineai -j 4
            mkdir -p export/native/$abi
            cp work/build-$abi/libofflineai.so export/native/$abi/
          done
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ai-v5-engines
          path: export/
          retention-days: 7
