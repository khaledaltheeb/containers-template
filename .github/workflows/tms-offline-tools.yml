name: TMs isolated Android tools
on:
  push:
    branches: [tms-offline-repair-20260911]
    paths: [.github/workflows/tms-offline-tools.yml]
permissions:
  contents: read
  actions: read
jobs:
  split-emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tms-local-emulator
          run-id: 34645155220
          github-token: ${{ github.token }}
      - run: |
          split -b 400M -d tms-emulator.tar.gz emulator.part.
          sha256sum emulator.part.*
      - uses: actions/upload-artifact@v4
        with:
          name: tms-emulator-part-00
          path: emulator.part.00
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: tms-emulator-part-01
          path: emulator.part.01
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: tms-emulator-part-02
          path: emulator.part.02
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: tms-emulator-part-03
          path: emulator.part.03
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: tms-emulator-part-04
          path: emulator.part.04
          compression-level: 0
          retention-days: 2
