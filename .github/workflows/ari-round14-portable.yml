name: ARI Round14 Portable Build

on:
  push:
    branches:
      - ari-round14-portable-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Reconstruct and verify ARI source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'ari14-final/part-00.txt',
            'ari14-final/part-01.txt',
            'ari14-final/part-02.txt',
            'ari14-final/part-03.txt',
            'ari14-fix10/p04-0.txt',
            'ari14-fix2k/p04-1-0-0.txt',
            'ari14-fix2k/p04-1-0-1.txt',
            'ari14-fix2k/p04-1-0-2.txt',
            'ari14-fix5/p04-1-1.txt',
            'ari14-final/part-05.txt',
            'ari14-final/part-06.txt',
            'ari14-fix10/p07-0.txt',
            'ari14-fix10/p07-1.txt',
            'ari14-fix10/p08-0.txt',
            'ari14-fix10/p08-1.txt',
            'ari14-fix10/p09-0.txt',
            'ari14-fix10/p09-1.txt',
            'ari14-fix10/p10-0.txt',
            'ari14-fix10/p10-1.txt',
            'ari14-fix10/p11-0.txt',
            'ari14-fix10/p11-1.txt',
            'ari14-fix10/p12-0.txt',
            'ari14-fix2k/p12-1-0-0.txt',
            'ari14-fix2k/p12-1-0-1.txt',
            'ari14-fix2k/p12-1-0-2.txt',
            'ari14-fix2k/p12-1-1-0.txt',
            'ari14-fix2k/p12-1-1-1.txt',
            'ari14-fix2k/p12-1-1-2.txt',
            'ari14-fix10/p13-0.txt'
          )
          foreach ($p in $paths) {
            $full = Join-Path $env:GITHUB_WORKSPACE $p
            if (-not (Test-Path $full)) { throw "Missing ARI payload part: $p" }
          }
          $b64 = ($paths | ForEach-Object { Get-Content (Join-Path $env:GITHUB_WORKSPACE $_) -Raw }) -join ''
          $b64 = $b64 -replace '\s',''
          if ($b64.Length -ne 262360) { throw "Unexpected ARI Base64 length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          $archive = Join-Path $env:RUNNER_TEMP 'ari-round14.tar.xz'
          [IO.File]::WriteAllBytes($archive, $bytes)
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'bc79f84cce619fbf0b278b99670a534743bf9b4ac7f4fe521c177a0f2c9f49a9'
          if ($actualHash -ne $expectedHash) { throw "ARI source SHA256 mismatch: $actualHash" }
          Write-Host "ARI source SHA256 verified: $actualHash"

          $extract = Join-Path $env:RUNNER_TEMP 'ari-src'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xJf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'ARI source archive extraction failed.' }
          $sln = Get-ChildItem $extract -Recurse -Filter 'ARI.slnx' | Select-Object -First 1
          if (-not $sln) { throw 'ARI.slnx not found after extraction.' }
          "ARI_ROOT=$($sln.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARI root: $($sln.Directory.FullName)"

      - name: Apply comprehensive Round 14 source fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT

          $fixParts = 0..5 | ForEach-Object { "ari14-srcfix-v2/part-{0:d2}.txt" -f $_ }
          foreach ($part in $fixParts) {
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $part))) { throw "Missing source-fix part: $part" }
          }
          $fixB64 = ($fixParts | ForEach-Object { Get-Content (Join-Path $env:GITHUB_WORKSPACE $_) -Raw }) -join ''
          $fixB64 = $fixB64 -replace '\s',''
          if ($fixB64.Length -ne 10512) { throw "Unexpected source-fix Base64 length: $($fixB64.Length)" }
          $fixXz = Join-Path $env:RUNNER_TEMP 'ari-round14-src-fixes.patch.xz'
          [IO.File]::WriteAllBytes($fixXz, [Convert]::FromBase64String($fixB64))
          $fixXzHash = (Get-FileHash $fixXz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fixXzHash -ne '0f5ada5b19f11ec6ae22fdf0aeddbc56577ac7ccc5747a488c788e334bbeed4d') {
            throw "Compressed source-fix SHA256 mismatch: $fixXzHash"
          }
          $patchPath = Join-Path $env:RUNNER_TEMP 'ari-round14-src-fixes.patch'
          python -c "import lzma,sys; open(sys.argv[2],'wb').write(lzma.open(sys.argv[1],'rb').read())" $fixXz $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Source-fix decompression failed.' }
          $patchHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '4b8f1e36b7160b57a0bae0501c2af303a745454b91e4fa7f7373645792213d43') {
            throw "Source-fix patch SHA256 mismatch: $patchHash"
          }
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Source-fix patch preflight failed.' }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Source-fix patch application failed.' }
          Write-Host "Comprehensive source-fix applied: $patchHash"

          $props = Get-Content 'Directory.Build.props' -Raw
          if ($props -notmatch '<Version>0\.14\.0</Version>') { throw 'Product Version is not 0.14.0.' }
          if ($props -notmatch '<FileVersion>0\.14\.0\.0</FileVersion>') { throw 'FileVersion is not 0.14.0.0.' }
          if ($props -notmatch '<AssemblyVersion>0\.14\.0\.0</AssemblyVersion>') { throw 'AssemblyVersion is not 0.14.0.0.' }
          python scripts/generate-manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed.' }
          python scripts/static-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Static verification failed.' }

      - name: Prepare OCR data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          if (Test-Path 'scripts/prepare-ocr-data.ps1') {
            & .\scripts\prepare-ocr-data.ps1
          }
          $tess = Join-Path $env:ARI_ROOT 'src\Ari.Desktop\tessdata'
          foreach ($lang in @('eng.traineddata','ara.traineddata')) {
            $file = Join-Path $tess $lang
            if (-not (Test-Path $file)) { throw "OCR language file missing: $lang" }
            if ((Get-Item $file).Length -lt 100000) { throw "OCR language file is incomplete: $lang" }
          }

      - name: Restore and build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet --info
          dotnet restore .\ARI.slnx
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet build .\ARI.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }

      - name: Deterministic verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet run --project .\src\Ari.Verification\Ari.Verification.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Ari.Verification failed.' }

      - name: Publish and self-test portable win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $out = Join-Path $env:GITHUB_WORKSPACE 'ari-portable'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish .\src\Ari.Desktop\Ari.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $exe = Join-Path $out 'ARI.exe'
          if (-not (Test-Path $exe)) { throw 'ARI.exe was not produced.' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ARI.exe self-test failed.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ARI.exe" | Set-Content (Join-Path $out 'ARI.exe.sha256') -Encoding ascii
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\ARI-Round14-Portable-win-x64.zip" -Force
          Write-Host "ARI.exe SHA256: $hash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARI-Round14-Portable-win-x64
          path: |
            ari-portable/**
            ARI-Round14-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
