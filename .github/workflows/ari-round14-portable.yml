name: ARI Round15 Portable Build

on:
  push:
    branches:
      - ari-round15-portable-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Run ARI Round 15 release gate
        shell: pwsh
        run: .\.github\scripts\build-ari-round15.ps1

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARI-Round15-Portable-win-x64
          path: |
            ari-portable/**
            ARI-Round15-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
