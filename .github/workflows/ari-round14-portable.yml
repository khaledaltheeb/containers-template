name: ARI Round15 Portable Build

on:
  push:
    branches:
      - ari-round15-portable-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Reconstruct and verify ARI Round 14 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'ari14-final/part-00.txt',
            'ari14-final/part-01.txt',
            'ari14-final/part-02.txt',
            'ari14-final/part-03.txt',
            'ari14-fix10/p04-0.txt',
            'ari14-fix2k/p04-1-0-0.txt',
            'ari14-fix2k/p04-1-0-1.txt',
            'ari14-fix2k/p04-1-0-2.txt',
            'ari14-fix5/p04-1-1.txt',
            'ari14-final/part-05.txt',
            'ari14-final/part-06.txt',
            'ari14-fix10/p07-0.txt',
            'ari14-fix10/p07-1.txt',
            'ari14-fix10/p08-0.txt',
            'ari14-fix10/p08-1.txt',
            'ari14-fix10/p09-0.txt',
            'ari14-fix10/p09-1.txt',
            'ari14-fix10/p10-0.txt',
            'ari14-fix10/p10-1.txt',
            'ari14-fix10/p11-0.txt',
            'ari14-fix10/p11-1.txt',
            'ari14-fix10/p12-0.txt',
            'ari14-fix2k/p12-1-0-0.txt',
            'ari14-fix2k/p12-1-0-1.txt',
            'ari14-fix2k/p12-1-0-2.txt',
            'ari14-fix2k/p12-1-1-0.txt',
            'ari14-fix2k/p12-1-1-1.txt',
            'ari14-fix2k/p12-1-1-2.txt',
            'ari14-fix10/p13-0.txt'
          )
          foreach ($p in $paths) {
            $full = Join-Path $env:GITHUB_WORKSPACE $p
            if (-not (Test-Path $full)) { throw "Missing ARI payload part: $p" }
          }
          $b64 = ($paths | ForEach-Object { Get-Content (Join-Path $env:GITHUB_WORKSPACE $_) -Raw }) -join ''
          $b64 = $b64 -replace '\s',''
          if ($b64.Length -ne 262360) { throw "Unexpected ARI Base64 length: $($b64.Length)" }
          $archive = Join-Path $env:RUNNER_TEMP 'ari-round14.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'bc79f84cce619fbf0b278b99670a534743bf9b4ac7f4fe521c177a0f2c9f49a9') { throw "ARI source SHA256 mismatch: $actualHash" }
          $extract = Join-Path $env:RUNNER_TEMP 'ari-src'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xJf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'ARI source archive extraction failed.' }
          $sln = Get-ChildItem $extract -Recurse -Filter 'ARI.slnx' | Select-Object -First 1
          if (-not $sln) { throw 'ARI.slnx not found after extraction.' }
          "ARI_ROOT=$($sln.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARI Round 14 source verified: $actualHash"

      - name: Apply comprehensive Round 14 fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $fixParts = 0..5 | ForEach-Object { "ari14-srcfix-v2/part-{0:d2}.txt" -f $_ }
          $fixB64 = ($fixParts | ForEach-Object { Get-Content (Join-Path $env:GITHUB_WORKSPACE $_) -Raw }) -join ''
          $fixB64 = $fixB64 -replace '\s',''
          if ($fixB64.Length -ne 10512) { throw "Unexpected Round 14 fix Base64 length: $($fixB64.Length)" }
          $fixXz = Join-Path $env:RUNNER_TEMP 'ari-round14-fixes.patch.xz'
          [IO.File]::WriteAllBytes($fixXz, [Convert]::FromBase64String($fixB64))
          if ((Get-FileHash $fixXz -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0f5ada5b19f11ec6ae22fdf0aeddbc56577ac7ccc5747a488c788e334bbeed4d') { throw 'Round 14 compressed patch hash mismatch.' }
          $patchPath = Join-Path $env:RUNNER_TEMP 'ari-round14-fixes.patch'
          python -c "import lzma,sys; open(sys.argv[2],'wb').write(lzma.open(sys.argv[1],'rb').read())" $fixXz $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 14 patch decompression failed.' }
          if ((Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4b8f1e36b7160b57a0bae0501c2af303a745454b91e4fa7f7373645792213d43') { throw 'Round 14 patch hash mismatch.' }
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 14 patch preflight failed.' }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 14 patch application failed.' }

      - name: Apply Round 15 portable database hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $patchB64Path = Join-Path $env:GITHUB_WORKSPACE 'ari15-patch\round15.patch.xz.b64'
          $patchB64 = (Get-Content $patchB64Path -Raw) -replace '\s',''
          if ($patchB64.Length -ne 16424) { throw "Unexpected Round 15 patch Base64 length: $($patchB64.Length)" }
          $patchXz = Join-Path $env:RUNNER_TEMP 'ari-round15.patch.xz'
          [IO.File]::WriteAllBytes($patchXz, [Convert]::FromBase64String($patchB64))
          $xzHash = (Get-FileHash $patchXz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzHash -ne 'ada9ee78312841fb19d8267958449996a3f9ac7edb0ce938f7d9d157f6a97b77') { throw "Round 15 compressed patch hash mismatch: $xzHash" }
          $patchPath = Join-Path $env:RUNNER_TEMP 'ari-round15.patch'
          python -c "import lzma,sys; open(sys.argv[2],'wb').write(lzma.open(sys.argv[1],'rb').read())" $patchXz $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 15 patch decompression failed.' }
          $patchHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '85e897206a148a22db4d88bbdc109eb241857e5b80beae2c88679be19048cf4b') { throw "Round 15 patch hash mismatch: $patchHash" }
          git apply --check --exclude=manifest.json $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 15 patch preflight failed.' }
          git apply --exclude=manifest.json $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Round 15 patch application failed.' }
          Write-Host "Round 15 patch verified and applied: $patchHash"

      - name: Download and verify Microsoft LocalDB runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $runtimeDir = Join-Path $env:ARI_ROOT 'src\Ari.Desktop\Runtime'
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $msi = Join-Path $runtimeDir 'SqlLocalDB.msi'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SqlLocalDB.msi' -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '224d483992ef60368dac70cea174dcfaf43a3ca06ada331c67dc6119a26490f6') { throw "LocalDB MSI SHA256 mismatch: $hash" }
          $signature = Get-AuthenticodeSignature $msi
          if ($signature.Status -ne 'Valid') { throw "LocalDB MSI Authenticode status is $($signature.Status)." }
          if ($signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw "Unexpected LocalDB MSI signer: $($signature.SignerCertificate.Subject)" }
          Write-Host "Microsoft LocalDB runtime verified: $hash"

      - name: Validate Round 15 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $props = Get-Content 'Directory.Build.props' -Raw
          if ($props -notmatch '<Version>0\.15\.0</Version>') { throw 'Product Version is not 0.15.0.' }
          if ($props -notmatch '<FileVersion>0\.15\.0\.0</FileVersion>') { throw 'FileVersion is not 0.15.0.0.' }
          if ($props -notmatch '<AssemblyVersion>0\.15\.0\.0</AssemblyVersion>') { throw 'AssemblyVersion is not 0.15.0.0.' }
          python scripts/generate-manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed.' }
          python scripts/static-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Static verification failed.' }

      - name: Prepare OCR data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          if (Test-Path 'scripts/prepare-ocr-data.ps1') { & .\scripts\prepare-ocr-data.ps1 }
          $tess = Join-Path $env:ARI_ROOT 'src\Ari.Desktop\tessdata'
          foreach ($lang in @('eng.traineddata','ara.traineddata')) {
            $file = Join-Path $tess $lang
            if (-not (Test-Path $file)) { throw "OCR language file missing: $lang" }
            if ((Get-Item $file).Length -lt 100000) { throw "OCR language file is incomplete: $lang" }
          }

      - name: Restore and build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet restore .\ARI.slnx
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet build .\ARI.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }

      - name: Deterministic verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet run --project .\src\Ari.Verification\Ari.Verification.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Ari.Verification failed.' }

      - name: Ensure LocalDB runtime for native smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $msi = Join-Path $env:ARI_ROOT 'src\Ari.Desktop\Runtime\SqlLocalDB.msi'
          $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$msi`"", 'IACCEPTSQLLOCALDBLICENSETERMS=YES', '/qn', '/norestart') -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 1638, 1641, 3010)) { throw "LocalDB MSI install failed with exit code $($proc.ExitCode)." }
          $localDbExe = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server" -Filter 'SqlLocalDB.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($localDbExe) {
            & $localDbExe.FullName info MSSQLLocalDB *> $null
            if ($LASTEXITCODE -ne 0) {
              & $localDbExe.FullName create MSSQLLocalDB
              if ($LASTEXITCODE -ne 0) { throw 'Unable to create MSSQLLocalDB instance.' }
            }
            & $localDbExe.FullName start MSSQLLocalDB
            if ($LASTEXITCODE -ne 0) { throw 'Unable to start MSSQLLocalDB instance.' }
          }

      - name: LocalDB full schema smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet run --project .\src\Ari.Verification\Ari.Verification.csproj -c Release --no-build -- --localdb-smoke
          if ($LASTEXITCODE -ne 0) { throw 'ARI LocalDB smoke test failed.' }

      - name: Publish and self-test portable win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $out = Join-Path $env:GITHUB_WORKSPACE 'ari-portable'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish .\src\Ari.Desktop\Ari.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $exe = Join-Path $out 'ARI.exe'
          if (-not (Test-Path $exe)) { throw 'ARI.exe was not produced.' }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.FileVersion -ne '0.15.0.0') { throw "Unexpected ARI.exe FileVersion: $($info.FileVersion)" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ARI.exe self-test failed.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ARI.exe" | Set-Content (Join-Path $out 'ARI.exe.sha256') -Encoding ascii
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\ARI-Round15-Portable-win-x64.zip" -Force
          Write-Host "ARI Round 15 executable SHA256: $hash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARI-Round15-Portable-win-x64
          path: |
            ari-portable/**
            ARI-Round15-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
