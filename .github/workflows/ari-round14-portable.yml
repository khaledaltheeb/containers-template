name: ARI Round14 Portable Build

on:
  push:
    branches:
      - ari-round14-portable-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Reconstruct ARI source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\ari14\u-*.txt" | Sort-Object Name
          if ($parts.Count -lt 2) { throw 'ARI source payload parts are missing.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $b64 = $b64 -replace '\s',''
          $bytes = [Convert]::FromBase64String($b64)
          $archive = Join-Path $env:RUNNER_TEMP 'ari-round14.tar.xz'
          [IO.File]::WriteAllBytes($archive, $bytes)
          $extract = Join-Path $env:RUNNER_TEMP 'ari-src'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xJf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'ARI source archive extraction failed.' }
          $sln = Get-ChildItem $extract -Recurse -Filter 'ARI.slnx' | Select-Object -First 1
          if (-not $sln) { throw 'ARI.slnx not found after extraction.' }
          "ARI_ROOT=$($sln.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARI root: $($sln.Directory.FullName)"

      - name: Normalize version and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $props = Get-Content 'Directory.Build.props' -Raw
          $props = $props -replace '<Version>[^<]+</Version>', '<Version>0.14.0</Version>'
          $props = $props -replace '<FileVersion>[^<]+</FileVersion>', '<FileVersion>0.14.0.0</FileVersion>'
          $props = $props -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', '<AssemblyVersion>0.14.0.0</AssemblyVersion>'
          Set-Content 'Directory.Build.props' $props -Encoding utf8
          python scripts/generate-manifest.py
          python scripts/static-check.py

      - name: Prepare OCR data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          if (Test-Path 'scripts/prepare-ocr-data.ps1') {
            & .\scripts\prepare-ocr-data.ps1
            if ($LASTEXITCODE -ne 0) { throw 'OCR preparation failed.' }
          }

      - name: Restore and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet --info
          dotnet restore .\ARI.slnx
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }
          dotnet build .\ARI.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }

      - name: Deterministic verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          dotnet run --project .\src\Ari.Verification\Ari.Verification.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Ari.Verification failed.' }

      - name: Publish portable win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:ARI_ROOT
          $out = Join-Path $env:GITHUB_WORKSPACE 'ari-portable'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish .\src\Ari.Desktop\Ari.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore -o $out
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $exe = Join-Path $out 'ARI.exe'
          if (-not (Test-Path $exe)) { throw 'ARI.exe was not produced.' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ARI.exe self-test failed.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ARI.exe" | Set-Content (Join-Path $out 'ARI.exe.sha256') -Encoding ascii
          Compress-Archive -Path "$out\*" -DestinationPath "$env:GITHUB_WORKSPACE\ARI-Round14-Portable-win-x64.zip" -Force
          Write-Host "ARI.exe SHA256: $hash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARI-Round14-Portable-win-x64
          path: |
            ari-portable/**
            ARI-Round14-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
