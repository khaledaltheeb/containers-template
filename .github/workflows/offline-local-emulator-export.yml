name: Export Android emulator for private local verification
on:
  push:
    branches: [build/offline-android-verification-20260911]
    paths: [.github/workflows/offline-local-emulator-export.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare official Android emulator and AOSP image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'emulator' 'platform-tools' 'system-images;android-35;default;x86_64' >/tmp/sdk.log 2>&1 || { cat /tmp/sdk.log; exit 1; }
          mkdir -p export/sdk out
          cp -a "$ANDROID_HOME/emulator" export/sdk/
          cp -a "$ANDROID_HOME/platform-tools" export/sdk/
          cp -a "$ANDROID_HOME/cmdline-tools" export/sdk/
          mkdir -p export/sdk/system-images/android-35/default
          cp -a "$ANDROID_HOME/system-images/android-35/default/x86_64" export/sdk/system-images/android-35/default/
          tar -C export -czf out/android-local-emulator.tar.gz sdk
          sha256sum out/android-local-emulator.tar.gz > out/SHA256.txt
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: android-local-emulator
          path: out/
          retention-days: 3
          compression-level: 0
